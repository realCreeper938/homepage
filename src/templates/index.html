<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{site.title}}</title>
  <meta name="description" content="{{site.description}}">
  <meta name="keywords" content="{{site.keywords}}">
  <meta name="author" content="{{site.author}}">
  <meta property="og:title" content="{{site.author}} — {{site.title}}">
  <meta property="og:description" content="{{site.description}}">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="{{site.author}} — {{site.title}}">
  <meta name="twitter:description" content="{{site.description}}">
  <meta name="robots" content="index, follow">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "{{site.author}}",
    "description": "{{site.description}}"
  }
  </script>
<link href="https://fontsapi.zeoseven.com/14/main/result.css" onload="this.rel='stylesheet'" rel="preload" as="style" crossorigin />
<noscript><link rel="stylesheet" href="https://fontsapi.zeoseven.com/14/main/result.css" /></noscript>
<style>
    body {
        font-family: "LXGW ZhiSong CL";
        font-weight: normal;
    }
</style>
  <style>

    /* ── Reset & Base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0d1117;
      --surface: rgba(22, 27, 34, 0.72);
      --surface-hover: rgba(22, 27, 34, 0.88);
      --text: #e6edf3;
      --text-muted: #8b949e;
      --accent: #58a6ff;
      --border: rgba(240, 246, 252, 0.08);
      --radius: 10px;
      --radius-sm: 8px;
    }
    html { font-size: 16px; scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Skip Link ── */
    .skip-link {
      position: absolute;
      top: -100%;
      left: 1rem;
      background: var(--accent);
      color: #000;
      padding: 0.5rem 1rem;
      border-radius: var(--radius-sm);
      z-index: 100;
      font-weight: 600;
      text-decoration: none;
    }
    .skip-link:focus { top: 1rem; }

    /* ── Background Layer ── */
    .bg-layer {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      background: var(--bg);
    }
    .bg-layer::before,
    .bg-layer::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.35;
      will-change: transform;
    }
    .bg-layer::before {
      width: 500px;
      height: 500px;
      background: #1f6feb;
      animation: orbDrift1 20s ease-in-out infinite;
    }
    .bg-layer::after {
      width: 420px;
      height: 420px;
      background: #a371f7;
      animation: orbDrift2 26s ease-in-out infinite;
    }
    .bg-image {
      position: absolute;
      inset: 0;
      background: {{site.background_css}} center/cover no-repeat;
      filter: {{site.background_blur}};
    }

    @keyframes orbDrift1 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      25% { transform: translate(50%, 30%) scale(1.15); }
      50% { transform: translate(30%, 60%) scale(0.9); }
      75% { transform: translate(-20%, 20%) scale(1.1); }
    }

    @keyframes orbDrift2 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      25% { transform: translate(-40%, -20%) scale(1.2); }
      50% { transform: translate(-20%, -50%) scale(0.85); }
      75% { transform: translate(30%, -30%) scale(1.05); }
    }

    /* ── Card ── */
    .card {
      width: 100%;
      max-width: 640px;
      background: {{site.card_background}};
      backdrop-filter: blur(24px) saturate(1.4);
      -webkit-backdrop-filter: blur(24px) saturate(1.4);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 3rem 2.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 1.5rem;
    }

    /* ── Avatar ── */
    .avatar-wrap {
      position: relative;
      width: 112px;
      height: 112px;
      flex-shrink: 0;
    }
    .avatar-glow {
      position: absolute;
      inset: -10px;
      width: calc(100% + 20px);
      height: calc(100% + 20px);
      border-radius: 70%;
      object-fit: cover;
      filter: blur(16px) saturate(1.3);
      opacity: 0.7;
      z-index: 0;
    }
    .avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--border);
      position: relative;
      z-index: 1;
    }

    /* ── Name & Tagline ── */
    .name {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
    }
    .alias {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: -1.25rem;
    }
    .tagline {
      font-size: 1rem;
      color: var(--text-muted);
      margin-top: -0.25rem;
    }

    /* ── Bio ── */
    .bio {
      max-width: 460px;
      font-size: 0.95rem;
      color: var(--text-muted);
      line-height: 1.7;
    }

    /* ── Navigation ── */
    .nav-links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      justify-content: center;
    }
    .nav-links a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      position: relative;
      width: 38px;
      height: 38px;
      border-radius: var(--radius-sm);
      background: rgba(255,255,255,0.04);
      color: var(--text);
      text-decoration: none;
      border: 1px solid var(--border);
      transition: background 0.2s, border-color 0.2s;
    }
    .nav-links a:hover,
    .nav-links a:focus-visible {
      background: var(--surface-hover);
      border-color: var(--accent);
      color: var(--text);
      outline: none;
    }
    .nav-links a:focus-visible { box-shadow: 0 0 0 3px rgba(88,166,255,0.4); }
    .nav-links .icon { width: 18px; height: 18px; stroke: currentColor; flex-shrink: 0; }
    .nav-links .nav-label {
      position: absolute;
      bottom: calc(100% + 8px);
      left: 50%;
      padding: 0.35rem 0.75rem;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text);
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      isolation: isolate;
      transition: opacity 0.15s, transform 0.15s;
      transform: translateX(-50%) translateY(4px);
    }
    .nav-links .nav-label::before {
      content: '';
      position: absolute;
      inset: 0;
      background: #fff;
      border: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: var(--radius-sm);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.12);
      z-index: -1;
    }
    .nav-links .nav-label::after {
      content: '';
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      border: 5px solid transparent;
      border-top-color: var(--border);
    }
    .nav-links a:hover .nav-label,
    .nav-links a:focus-visible .nav-label {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ── Shields Container ── */
    .shields-section { width: 100%; }
    .shields-section h2 {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 0.75rem;
    }
    .shields-section h2::before,
    .shields-section h2::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }
    .shields-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      justify-content: center;
    }
    .shields-grid a {
      display: inline-block;
      transition: transform 0.15s;
    }
    .shields-grid a:hover {
      transform: scale(1.05);
    }
    .shields-grid img {
      height: 24px;
      display: block;
      border-radius: 4px;
    }

    /* ── Footer ── */
    .site-footer {
      margin-top: 2rem;
      font-size: 0.8rem;
      color: var(--text-muted);
      text-align: center;
    }
    .site-footer a {
      color: var(--accent);
      text-decoration: none;
    }
    .site-footer a:hover { text-decoration: underline; }

    /* ── Entrance Animation ── */
    .reveal-text .char {
      display: inline-block;
      opacity: 0;
      animation: charIn 0.16s ease-out forwards;
    }
    @keyframes charIn {
      from { opacity: 0; transform: translateX(-4px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    .card > :not(.reveal-text) {
      opacity: 0;
      animation: blockIn 0.35s ease-out forwards;
    }
    @keyframes blockIn {
      from { opacity: 0; transform: translateX(-14px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    /* ── Responsive ── */
    @media (max-width: 520px) {
      .card { padding: 2rem 1.25rem; }
      .name { font-size: 1.5rem; }
      .avatar-wrap { width: 88px; height: 88px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f6f8fa;
        --surface: rgba(255,255,255,0.72);
        --surface-hover: rgba(255,255,255,0.9);
        --text: #1f2328;
        --text-muted: #656d76;
        --accent: #0969da;
        --border: rgba(31,35,40,0.08);
      }
      .bg-layer::before { background: #0969da; opacity: 0.18; }
      .bg-layer::after { background: #825ef7; opacity: 0.12; }
      .bg-image {
        background: {{site.background_css_light}} center/cover no-repeat;
        filter: {{site.background_blur}};
      }
      .card {
        background: rgb(255 255 255 / 25%);
      }
      .nav-links .nav-label {
        color: #1f2328;
      }
    }
    }
  </style>
</head>
<body>

  <a href="#main-content" class="skip-link">跳转到主内容</a>

  <div class="bg-layer" aria-hidden="true">
    <div class="bg-image"></div>
  </div>

  <main id="main-content" class="card" role="main" aria-labelledby="name-heading">
    <!-- Avatar -->
    <div class="avatar-wrap">
      <img class="avatar-glow" src="{{avatar.src}}" alt="" aria-hidden="true">
      <img class="avatar"
           src="{{avatar.src}}"
           alt="{{avatar.alt}}"
           width="112" height="112">
    </div>

    <!-- Name & Tagline -->
    <h1 id="name-heading" class="name reveal-text">{{site.author}}</h1>
    <p class="alias reveal-text">{{site.alias}}</p>
    <p class="tagline reveal-text">{{site.description}}</p>

    <!-- Bio -->
    <div class="bio">
      {{content}}
      <div class="shields-grid" role="list">
        {{badges.contact}}
      </div>
    </div>

    <!-- Shields Badges -->
    <section class="shields-section" aria-label="Contact Me">
      <h2>Contact Me</h2>
    </section>

    <!-- Navigation / Contact -->
    <nav class="nav-links" aria-label="导航链接">
      {{nav}}
    </nav>
  </main>

  <footer class="site-footer" role="contentinfo">
    <p>&copy; {{footer.year}} <a href="/">{{footer.copyright_holder}}</a>. All rights reserved.</p>
  </footer>

<script src="https://cdn.jsdmirror.com/npm/feather-icons/dist/feather.min.js"></script>
<script>document.addEventListener('DOMContentLoaded',function(){feather.replace({class:'icon'})})</script>
<script>(function(){var d=0,t=22;document.querySelectorAll('.reveal-text').forEach(function(e){var c=[...e.textContent];e.textContent='';c.forEach(function(h,i){var s=document.createElement('span');s.className='char';s.style.animationDelay=(d+i*t)+'ms';s.textContent=h===' '?'\xa0':h;e.appendChild(s)});d+=c.length*t});document.querySelectorAll('.card>:not(.reveal-text)').forEach(function(e,i){e.style.animationDelay=(d+i*50)+'ms'})})()</script>
</body>
</html>
