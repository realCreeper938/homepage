<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="{{site.favicon}}">
  <title>{{site.title}}</title>
  <meta name="description" content="{{site.description}}">
  <meta name="keywords" content="{{site.keywords}}">
  <meta name="author" content="{{site.author}}">
  <meta property="og:title" content="{{site.author}} — {{site.title}}">
  <meta property="og:description" content="{{site.description}}">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="{{site.author}} — {{site.title}}">
  <meta name="twitter:description" content="{{site.description}}">
  <meta name="robots" content="index, follow">
<link href="https://fontsapi.zeoseven.com/226/main/result.css" onload="this.rel='stylesheet'" rel="preload" as="style" crossorigin />
<noscript><link rel="stylesheet" href="https://fontsapi.zeoseven.com/226/main/result.css" /></noscript>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "{{site.author}}",
    "description": "{{site.description}}"
  }
  </script>
  <style>
    @font-face {
      font-family: "ZSFT-2167";
      src: url("https://fontsapi.zeoseven.com/2167/main.woff2") format("woff2");
      font-style: normal;
      font-weight: 100 900;
      font-display: swap;
    }

    @font-face {
      font-family: "ZSFT-fl";
      src: url("https://fontsapi.zeoseven.com/fl/main.woff2") format("woff2");
      font-style: normal;
      font-weight: 100 900;
      font-display: swap;
    }

    @font-face {
      font-family: "ZSFT-2155";
      src: url("https://fontsapi.zeoseven.com/2155/main.woff2") format("woff2");
      font-style: normal;
      font-weight: 100 900;
      font-display: swap;
    }

    /* ── Reset & Base ── */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      color-scheme: dark;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      background: #000;
      color: #fff;
      overflow: hidden;
      font-family: "LXGW XiHei CL", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    ::selection {
      background: #18d1ff;
      color: #000;
    }

    /* ── 舞台（固定全屏） ── */
    .stage {
      position: relative;
      width: 100vw;
      max-width: 180rem;
      height: 100vh;
      margin: auto;
      overflow: hidden;
      background: #000;
    }

      /* 背景网格（监控屏质感，米字格线） */
      .bg-grid {
        position: absolute;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        background-image:
          /* 主网格 - 水平线 */
          linear-gradient(rgba(255, 255, 255, .04) 1px, transparent 1px),
          /* 主网格 - 垂直线 */
          linear-gradient(90deg, rgba(255, 255, 255, .04) 1px, transparent 1px),
          /* 对角线 - 45度 */
          linear-gradient(45deg, rgba(255, 255, 255, .015) 1px, transparent 1px),
          /* 对角线 - 135度 */
          linear-gradient(-45deg, rgba(255, 255, 255, .015) 1px, transparent 1px);
        background-size:
          4rem 4rem,
          4rem 4rem,
          5.66rem 5.66rem,
          5.66rem 5.66rem;
        animation: gridBoot .9s ease-out .05s both;
      }

      /* CRT 开机：网格轻微闪烁 / 由远及近 */
      @keyframes gridBoot {
        0%   { opacity: 0; transform: scale(1.03); }
        25%  { opacity: .28; }
        34%  { opacity: .08; }
        44%  { opacity: .5; }
        100% { opacity: 1; transform: scale(1); }
      }

      }


    /* 鼠标跟随光晕（点亮所指区域，低强度） */
    .bg-grid .grid-spotlight {
      position: absolute;
      top: 0;
      left: 0;
      width: 22rem;
      height: 22rem;
      margin: -11rem 0 0 -11rem;
      background: radial-gradient(circle,
        rgba(24, 209, 255, .07) 0%,
        rgba(24, 209, 255, .03) 45%,
        transparent 70%);
      mix-blend-mode: screen;
      opacity: 0;
      transition: opacity .3s;
      will-change: transform;
    }
    .bg-grid.grid-lit .grid-spotlight { opacity: 1; }
    @media (any-hover: none) { .bg-grid .grid-spotlight { display: none; } }

    /* ── 留白框 ── */
    .frame {
      position: absolute;
      top: 9.5rem;
      bottom: 11.25rem;
      left: 9rem;
      right: 14.75rem;
      z-index: 1;
    }

    /* 取景框四角（青色角标，终端视角） */
    .fc {
      position: absolute;
      width: 1.5rem;
      height: 1.5rem;
      z-index: 3;
      pointer-events: none;
      opacity: 0;
      animation: fcIn .4s ease-out forwards;
    }

    .fc-tl { top: -.5rem; left: -.5rem; border-top: 2px solid #18d1ff; border-left: 2px solid #18d1ff; animation-delay: .2s; }
    .fc-tr { top: -.5rem; right: -.5rem; border-top: 2px solid #18d1ff; border-right: 2px solid #18d1ff; animation-delay: .3s; }
    .fc-bl { bottom: -.5rem; left: -.5rem; border-bottom: 2px solid #18d1ff; border-left: 2px solid #18d1ff; animation-delay: .4s; }
    .fc-br { bottom: -.5rem; right: -.5rem; border-bottom: 2px solid #18d1ff; border-right: 2px solid #18d1ff; animation-delay: .5s; }

    @keyframes fcIn {
      from {
        opacity: 0;
        transform: scale(.4);
      }
      to {
        opacity: .9;
        transform: scale(1);
      }
    }

    /* ── 档案式标题 ── */
    .eyebrow {
      font-family: ZSFT-2167, "Arial Narrow", sans-serif;
      letter-spacing: .2em;
      font-weight: 700;
      font-size: .875rem;
      color: #fff;
      white-space: nowrap;
    }

    .eyebrow::before {
      content: "";
      display: inline-block;
      width: .4rem;
      height: .4rem;
      margin-right: .75rem;
      background: #18d1ff;
      vertical-align: .1em;
    }

    .cn-title {
      font-family: ZSFT-fl, "Arial Narrow", sans-serif;
      font-size: 3.5rem;
      font-weight: 700;
      letter-spacing: .08em;
      color: #fff;
      margin: 0 0 .75rem;
      line-height: 1.1;
    }

    /* ── 发丝线 ── */
    .topline {
      display: flex;
      align-items: center;
      gap: 1.25rem;
      position: relative;
      z-index: 1;
    }

    .topline-rule {
      height: 1px;
      flex: 1;
      background: hsla(0, 0%, 100%, .3);
    }

    .title-rule {
      width: 6rem;
      height: 1px;
      background: rgba(24, 209, 255, .5);
      margin-bottom: 1.5rem;
      transform-origin: left center;
      transition: width .6s cubic-bezier(.4, 0, .2, 1), background-color .3s;
      animation: titleRuleIn .8s cubic-bezier(.4, 0, .2, 1) .6s both;
    }

    @keyframes titleRuleIn {
      from { transform: scaleX(0); }
      to   { transform: scaleX(1); }
    }

    .identity:hover .title-rule,
    .identity:focus-within .title-rule {
      width: 100%;
      background-color: #18d1ff;
    }

    .hairline {
      height: 1px;
      background: hsla(0, 0%, 100%, .3);
    }

    /* ── 页面切换 ── */
    .page {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      min-height: 0;
      transition: transform .6s ease, opacity .6s ease;
    }

    .page-1 {
      transform: translateY(0);
      opacity: 1;
    }

    .page-2 {
      transform: translateY(100%);
      opacity: 0;
      pointer-events: none;
    }

    .stage.flipped .page-1 {
      transform: translateY(-100%);
      opacity: 0;
      pointer-events: none;
    }

    .stage.flipped .page-2 {
      transform: translateY(0);
      opacity: 1;
      pointer-events: auto;
    }

    /* ── Page 1 布局 ── */
    .page-1 {
      padding-top: 1rem;
    }

    .profile-row {
      position: relative;
      z-index: 1;
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      gap: 3rem;
    }

    .avatar-card {
      position: relative;
      flex-shrink: 0;
      border: .625rem solid #fff;
      box-shadow: -.5rem .5rem 1rem rgba(0,0,0,.6);
    }

    .avatar-card::after {
      content: "";
      position: absolute;
      inset: -1rem;
      border: 1px solid hsla(0, 0%, 100%, .14);
      z-index: -2;
    }

    .avatar-card .corner {
      position: absolute;
      top: -1.2rem;
      right: -1.2rem;
      z-index: -1;
      width: 2.5rem;
      height: 2.5rem;
      background: #18d1ff;
      clip-path: polygon(100% 0, 0 0, 100% 100%);
    }

    .avatar-card .avatar {
      display: block;
      width: 11rem;
      height: 11rem;
      object-fit: cover;
      background: #1d1f20;
    }

    .identity {
      min-width: 0;
    }

    .greeting {
      font-family: ZSFT-fl, "Arial Narrow", sans-serif;
      font-size: .875rem;
      font-weight: 400;
      letter-spacing: .28em;
      color: #18d1ff;
      margin-bottom: .5rem;
    }

    .alias {
      color: #ababab;
      font-size: 1rem;
      margin-bottom: .4rem;
    }

    .tagline {
      color: #d2d2d2;
      font-size: 1rem;
      line-height: 1.8;
      max-width: 34rem;
    }

    .tagline::before,
    .tagline::after {
      color: #18d1ff;
      font-weight: 700;
    }

    .tagline::before {
      content: "\201C";
      margin-right: .25em;
    }

    .tagline::after {
      content: "\201D";
      margin-left: .25em;
    }

    /* ── 导航列表 ── */
    .nav-list {
      position: relative;
      z-index: 1;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 1.25rem;
      height: 3.5rem;
      padding-left: 1.75rem;
      border-bottom: 1px solid hsla(0, 0%, 100%, .3);
      color: #ababab;
      text-decoration: none;
      letter-spacing: .1em;
      position: relative;
      transition: color .2s, padding-left .35s cubic-bezier(.4, 0, .2, 1);
    }

    .nav-item::before {
      content: "";
      position: absolute;
      left: 0;
      top: 50%;
      width: 2px;
      height: 0;
      background: #18d1ff;
      transform: translateY(-50%);
      transition: height .35s cubic-bezier(.4, 0, .2, 1);
    }

    .nav-item:first-child {
      border-top: 1px solid hsla(0, 0%, 100%, .3);
    }

    .nav-item .nav-num {
      font-family: ZSFT-fl, "Arial Narrow", sans-serif;
      font-size: .75rem;
      letter-spacing: .15em;
      color: #585858;
      min-width: 2rem;
      transition: color .2s;
    }

    .nav-item .nav-label {
      display: flex;
      flex-direction: column;
      line-height: 1.2;
    }

    .nav-item .nav-en {
      font-family: ZSFT-fl, "Arial Narrow", sans-serif;
      font-size: .75rem;
      letter-spacing: .15em;
      color: #585858;
      transition: color .2s;
    }

    .nav-item .nav-cn {
      font-size: 1rem;
      letter-spacing: .1em;
    }

    .nav-item i {
      width: 16px;
      height: 16px;
      margin-left: auto;
      color: #585858;
      flex-shrink: 0;
      transition: color .2s, transform .3s;
    }

    @media (any-hover: hover) {
      .nav-item:hover {
        color: #18d1ff;
        padding-left: 2.25rem;
      }

      .nav-item:hover::before {
        height: 60%;
      }

      .nav-item:hover .nav-num {
        color: #18d1ff;
      }

      .nav-item:hover .nav-en {
        color: #18d1ff;
      }

      .nav-item:hover i {
        color: #18d1ff;
        transform: translateX(.25rem);
      }
    }

    .nav-item:focus-visible {
      outline: 1px solid #18d1ff;
      outline-offset: 4px;
      color: #18d1ff;
    }

    .nav-item:focus-visible::before {
      height: 60%;
    }

    /* ── 按钮 ── */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      gap: 2rem;
      height: 3.75rem;
      padding: 0 3.375rem 0 1.5rem;
      border: 0;
      font-family: inherit;
      cursor: pointer;
      text-decoration: none;
      transition: color .3s, background-color .3s;
    }

    .btn .btn-text {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      line-height: 1.25;
    }

    .btn .cn {
      font-size: 1.25rem;
      font-weight: 700;
    }

    .btn .en {
      font-family: ZSFT-fl, "Arial Narrow", sans-serif;
      font-size: .875rem;
      letter-spacing: .1em;
    }

    .btn .arrow {
      width: .5rem;
      transition: transform .3s cubic-bezier(.4, 0, .2, 1);
    }

    .btn .arrow-left {
      width: .5rem;
      transform: rotate(-90deg);
    }

    .btn.primary {
      position: relative;
      overflow: hidden;
      background-color: #18d1ff;
      color: #000;
      animation: btnIn .5s cubic-bezier(.22, .8, .3, 1) .95s backwards;
    }

    .btn.primary::after {
      content: "";
      position: absolute;
      top: 0;
      left: -30%;
      width: 30%;
      height: 100%;
      background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .55), transparent);
      transform: skewX(-20deg);
      animation: btnSheen 1.1s cubic-bezier(.4, 0, .2, 1) 1.3s forwards;
    }

    @keyframes btnIn {
      from {
        opacity: 0;
        transform: translateY(1rem);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes btnSheen {
      from {
        left: -30%;
      }
      to {
        left: 120%;
      }
    }

    .btn.gray {
      background-color: #585858;
      color: #fff;
    }

    @media (any-hover: hover) {
      .btn:hover {
        background-color: #fff;
        color: #000;
      }

      .btn:hover .arrow {
        transform: translateX(.25rem);
      }
    }

    .btn:focus-visible {
      outline: 1px solid #18d1ff;
      outline-offset: 3px;
    }

    .btn-back {
      height: 3rem;
      padding: 0 2rem 0 2.5rem;
    }

    .action-row {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 2rem;
      margin-top: 2rem;
    }

    /* ── Shields ── */
    .shields-section {
      margin-right: auto;
    }

    .shields-section h2 {
      font-family: ZSFT-fl, "Arial Narrow", sans-serif;
      font-size: .75rem;
      font-weight: 400;
      letter-spacing: .2em;
      color: #ababab;
      margin-bottom: .5rem;
    }

    .shields-grid {
      display: flex;
      flex-wrap: wrap;
      gap: .75rem;
    }

    .shields-grid img {
      height: 1.5rem;
      display: block;
    }

    /* ── Page 2 内容 ── */
    .page-2 {
      padding-top: 1rem;
    }

    .page-2 .topline {
      margin-bottom: 2rem;
    }

    .content {
      position: relative;
      z-index: 1;
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding-right: 2rem;
      font-size: 1rem;
      color: #d2d2d2;
      line-height: 1.8;
    }

    .content h1 {
      position: relative;
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: .05em;
      color: #fff;
      margin: 1.75rem 0 .75rem;
      padding: 0 0 .5rem .9rem;
      border-bottom: 1px solid hsla(0, 0%, 100%, .3);
    }

    .content h1::before {
      content: "";
      position: absolute;
      left: 0;
      top: .28em;
      width: .45rem;
      height: .45rem;
      background: #18d1ff;
    }

    .content h1:first-child {
      margin-top: 0;
    }

    .content h2 {
      font-size: 1.25rem;
      font-weight: 700;
      color: #fff;
      margin: 1.5rem 0 .5rem;
    }

    .content h3 {
      font-size: 1.1rem;
      font-weight: 600;
      color: #fff;
      margin: 1.25rem 0 .4rem;
    }

    .content p {
      margin-bottom: .85rem;
    }

    .content a {
      color: #18d1ff;
      text-decoration: none;
      border-bottom: 1px solid rgba(24, 209, 255, .4);
      transition: color .2s, border-color .2s;
    }

    @media (any-hover: hover) {
      .content a:hover {
        color: #fff;
        border-color: #fff;
      }
    }

    .content ul,
    .content ol {
      padding-left: 1.4rem;
      margin-bottom: .85rem;
    }

    .content li {
      margin-bottom: .3rem;
    }

    .content blockquote {
      margin: 0 0 .85rem;
      padding: .4rem 1rem;
      border-left: 1px solid #18d1ff;
      color: #ababab;
      background: rgba(24, 209, 255, .04);
    }

    .content blockquote p:last-child {
      margin-bottom: 0;
    }

    .content code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: .85em;
      background: rgba(24, 209, 255, .08);
      padding: .15em .4em;
    }

    .content pre {
      background: #0a0a0a;
      border: 1px solid hsla(0, 0%, 100%, .12);
      padding: 1rem;
      overflow-x: auto;
      margin-bottom: .85rem;
    }

    .content pre code {
      background: none;
      padding: 0;
    }

    .content hr {
      border: 0;
      height: 1px;
      background: hsla(0, 0%, 100%, .3);
      margin: 1.5rem 0;
    }

    .content table {
      border-collapse: collapse;
      width: 100%;
      margin-bottom: .85rem;
    }

    .content th,
    .content td {
      border: 1px solid hsla(0, 0%, 100%, .3);
      padding: .45rem .7rem;
      text-align: left;
    }

    .content th {
      background: rgba(255, 255, 255, .05);
      color: #fff;
    }

    .content img {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 1rem 0;
      filter: drop-shadow(-.5rem .5rem 1rem #000);
    }

    .content::-webkit-scrollbar {
      width: .25rem;
    }

    .content::-webkit-scrollbar-track {
      background: transparent;
    }

    .content::-webkit-scrollbar-thumb {
      background: #18d1ff;
    }

    .content::-webkit-scrollbar-thumb:hover {
      background: #fff;
    }

    /* ── 留言板面板 ── */
    .comments-backdrop {
      position: fixed;
      inset: 0;
      z-index: 49;
      background: rgba(0, 0, 0, .6);
      opacity: 0;
      pointer-events: none;
      transition: opacity .35s ease;
    }

    .comments-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .comments-panel {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: 32rem;
      z-index: 50;
      display: flex;
      flex-direction: column;
      background: #000;
      border-left: 1px solid hsla(0, 0%, 100%, .3);
      transform: translateX(100%);
      transition: transform .45s cubic-bezier(.22, .8, .3, 1);
    }

    .comments-panel.open {
      transform: translateX(0);
    }

    .comments-panel-head {
      display: flex;
      align-items: center;
      gap: 1.25rem;
      flex-shrink: 0;
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid hsla(0, 0%, 100%, .3);
    }

    .comments-close {
      margin-left: auto;
      width: 2.25rem;
      height: 2.25rem;
      border: 1px solid hsla(0, 0%, 100%, .3);
      background: transparent;
      color: #ababab;
      font-size: 1rem;
      line-height: 1;
      cursor: pointer;
      font-family: inherit;
      transition: color .2s, border-color .2s, background-color .2s;
    }

    .comments-close:hover {
      color: #18d1ff;
      border-color: #18d1ff;
      background: rgba(24, 209, 255, .08);
    }

    .comments-panel-body {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 1.5rem;
      font-size: .875rem;
      line-height: 1.8;
      color: #d2d2d2;
    }

    .comments-panel-body::-webkit-scrollbar {
      width: .25rem;
    }

    .comments-panel-body::-webkit-scrollbar-track {
      background: transparent;
    }

    .comments-panel-body::-webkit-scrollbar-thumb {
      background: #18d1ff;
    }

    .comments-panel-body::-webkit-scrollbar-thumb:hover {
      background: #fff;
    }

    .comments-panel-body .twikoo .tk-comments {
      color: #d2d2d2;
      font-size: .875rem;
      line-height: 1.8;
      font-family: inherit;
    }

    .comments-panel-body .twikoo .tk-comments .tk-avatar {
      width: 2.5rem;
      height: 2.5rem;
    }

    .comments-panel-body .twikoo .tk-comments .tk-avatar-img {
      border-radius: 0;
      background: #1d1f20;
    }

    /* ── 输入区 ── */
    .comments-panel-body .twikoo .tk-comments .tk-submit textarea {
      background: #0a0a0a;
      border: 1px solid hsla(0, 0%, 100%, .3);
      color: #fff;
      border-radius: 0;
      font-family: inherit;
      transition: border-color .2s;
    }

    .comments-panel-body .twikoo .tk-comments .tk-submit textarea:focus {
      border-color: #18d1ff;
      outline: none;
    }

    .comments-panel-body .twikoo .tk-comments .tk-meta-input .el-input {
      border-radius: 0;
    }

    .comments-panel-body .twikoo .tk-comments .tk-meta-input {
      margin-bottom: 1.25rem;
    }

    .comments-panel-body .twikoo .tk-comments .tk-meta-input .el-input__inner {
      background: #0a0a0a;
      border: 1px solid hsla(0, 0%, 100%, .3);
      border-radius: 0;
      color: #fff;
      font-family: inherit;
      transition: border-color .2s;
    }

    .comments-panel-body .twikoo .tk-comments .tk-meta-input .el-input__inner:focus {
      border-color: #18d1ff;
      outline: none;
    }

    .comments-panel-body .twikoo .tk-comments .tk-meta-input .el-input-group__prepend {
      background: #1d1f20;
      border: 1px solid hsla(0, 0%, 100%, .3);
      border-right: 0;
      border-radius: 0;
      color: #ababab;
      font-family: inherit;
    }

    /* ── 提交按钮 ── */
    .comments-panel-body .twikoo .tk-comments .tk-submit-action-icon {
      background: transparent;
      color: #585858;
      border: 0;
      border-radius: 0;
      font-family: inherit;
      font-weight: 700;
      line-height: 1;
      transition: color .2s, background-color .2s;
    }

    .comments-panel-body .twikoo .tk-comments .tk-submit-action-icon:hover {
      color: #18d1ff;
      background: rgba(24, 209, 255, .08);
    }

    .comments-panel-body .twikoo .tk-comments .tk-send.el-button {
      background: #18d1ff;
      border-color: #18d1ff;
      border-radius: 0;
      color: #000;
      font-family: inherit;
      font-weight: 700;
      letter-spacing: .1em;
      transition: background-color .2s, color .2s, border-color .2s;
    }

    .comments-panel-body .twikoo .tk-comments .tk-send.el-button:hover {
      background: #fff;
      border-color: #fff;
      color: #000;
    }

    .comments-panel-body .twikoo .tk-comments .tk-send.el-button.is-disabled,
    .comments-panel-body .twikoo .tk-comments .tk-send.el-button.is-disabled:hover {
      background: hsla(0, 0%, 100%, .12);
      border-color: hsla(0, 0%, 100%, .12);
      color: #585858;
      cursor: not-allowed;
    }

    .comments-panel-body .twikoo .tk-comments .tk-preview.el-button {
      background: transparent;
      border: 1px solid hsla(0, 0%, 100%, .3);
      border-radius: 0;
      color: #ababab;
      font-family: inherit;
      transition: color .2s, border-color .2s, background-color .2s;
    }

    .comments-panel-body .twikoo .tk-comments .tk-preview.el-button:hover {
      border-color: #18d1ff;
      color: #18d1ff;
      background: rgba(24, 209, 255, .08);
    }

    /* ── 元信息 / 操作 ── */
    .comments-panel-body .twikoo .tk-comments .tk-row-actions button,
    .comments-panel-body .twikoo .tk-comments .tk-meta,
    .comments-panel-body .twikoo .tk-comments .tk-time {
      color: #ababab;
      border-radius: 0;
      font-family: inherit;
      background: transparent;
    }

    .comments-panel-body .twikoo .tk-comments .tk-row-actions button:hover,
    .comments-panel-body .twikoo .tk-comments .tk-meta .tk-nick:hover {
      color: #18d1ff;
    }

    .comments-panel-body .twikoo .tk-comments .tk-row-actions button,
    .comments-panel-body .twikoo .tk-comments .tk-row-actions button.el-button {
      border: 0;
    }

    .comments-panel-body .twikoo .tk-comments .tk-comment {
      border-bottom: 1px solid hsla(0, 0%, 100%, .12);
      padding: 1.5rem 0;
      margin: 0;
    }

    .comments-panel-body .twikoo .tk-comments .tk-comment:first-of-type {
      padding-top: .5rem;
    }

    .comments-panel-body .twikoo .tk-comments .tk-comments-container {
      margin-top: 1.5rem;
    }

    .comments-panel-body .twikoo .tk-comments .tk-comments-title {
      color: #fff;
      font-weight: 700;
      letter-spacing: .1em;
      margin-bottom: 1rem;
      padding-bottom: .5rem;
      border-bottom: 1px solid hsla(0, 0%, 100%, .3);
    }

    .comments-panel-body .twikoo .tk-comments .tk-content,
    .comments-panel-body .twikoo .tk-comments .tk-comments-container .tk-content {
      color: #d2d2d2;
      margin-top: 1rem;
    }

    .comments-panel-body .twikoo .tk-comments .tk-row.actions {
      margin-top: 1.25rem;
    }

    .comments-panel-body .twikoo .tk-comments a {
      color: #18d1ff;
      text-decoration: none;
      border-bottom: 1px solid rgba(24, 209, 255, .4);
    }

    .comments-panel-body .twikoo .tk-comments a:hover {
      color: #fff;
      border-color: #fff;
    }

    /* ── 搜索框 ── */
    .comments-panel-body .twikoo .tk-comments .tk-comments-search .el-input__inner {
      background: #0a0a0a;
      border: 1px solid hsla(0, 0%, 100%, .3);
      border-radius: 0;
      color: #fff;
      font-family: inherit;
      transition: border-color .2s;
    }

    .comments-panel-body .twikoo .tk-comments .tk-comments-search .el-input__inner:focus {
      border-color: #18d1ff;
      outline: none;
    }

    .comments-panel-body .twikoo .tk-comments .tk-comments-search .el-button {
      background: transparent;
      border: 1px solid hsla(0, 0%, 100%, .3);
      border-radius: 0;
      color: #ababab;
      font-family: inherit;
    }

    .comments-panel-body .twikoo .tk-comments .tk-comments-search .el-button:hover {
      border-color: #18d1ff;
      color: #18d1ff;
    }

    /* ── 空状态 ── */
    .comments-panel-body .twikoo .tk-comments .tk-comments-no {
      color: #585858;
    }

    /* ── 表情面板 ── */
    .comments-panel-body .twikoo .tk-comments .OwO-body {
      background: #0a0a0a;
      border: 1px solid hsla(0, 0%, 100%, .2);
      border-radius: 0;
    }

    .comments-panel-body .twikoo .tk-comments .OwO-items {
      background: transparent;
    }

    .comments-panel-body .twikoo .tk-comments .OwO-item:hover {
      background: rgba(24, 209, 255, .15);
    }

    .comments-panel-body .twikoo .tk-comments .OwO-logo,
    .comments-panel-body .twikoo .tk-comments .tk-submit-action-icon.OwO {
      border-radius: 0;
    }

    .comments-panel-body .twikoo .tk-comments .tk-footer,
    .comments-panel-body .twikoo .tk-comments .tk-footer a {
      color: #585858;
    }

    /* ── 页脚 ── */
    .site-footer {
      position: absolute;
      left: 9rem;
      right: 14.75rem;
      bottom: 4rem;
      z-index: 1;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 1rem;
      border-top: 1px solid hsla(0, 0%, 100%, .3);
      font-family: ZSFT-fl, "Arial Narrow", sans-serif;
      font-size: .75rem;
      letter-spacing: .15em;
      color: #ababab;
    }

    .site-footer a {
      color: #d2d2d2;
      text-decoration: none;
      transition: color .2s;
    }

    @media (any-hover: hover) {
      .site-footer a:hover {
        color: #18d1ff;
      }
    }

    /* ── 跳转链接 ── */
    .skip-link {
      position: absolute;
      top: -100%;
      left: 1rem;
      z-index: 100;
      background: #18d1ff;
      color: #000;
      padding: .5rem 1rem;
      font-weight: 700;
      text-decoration: none;
    }

    .skip-link:focus {
      top: 1rem;
    }

    /* ── 入场动画 ── */
    .reveal-text .char {
      display: inline-block;
      opacity: 0;
      animation: charIn .35s cubic-bezier(.3, 1.4, .5, 1) forwards;
    }

    @keyframes charIn {
      from {
        opacity: 0;
        transform: translateY(.6rem) scale(.4);
        filter: blur(4px);
      }
      70% {
        opacity: 1;
        filter: blur(0);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0);
      }
    }

    /* 段落块：上滑 + 轻微模糊收场 */
    .stagger {
      opacity: 0;
      animation: blockIn .5s cubic-bezier(.22, .8, .3, 1) forwards;
    }

    @keyframes blockIn {
      from {
        opacity: 0;
        transform: translateY(1.5rem);
        filter: blur(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
        filter: blur(0);
      }
    }

    /* 头像：翻入 + 角标弹出 */
    .avatar-card {
      animation: avatarIn .6s cubic-bezier(.3, 1.2, .4, 1) .35s backwards;
    }

    @keyframes avatarIn {
      from {
        opacity: 0;
        transform: rotate(8deg) scale(.8);
      }
      to {
        opacity: 1;
        transform: rotate(0) scale(1);
      }
    }

    .avatar-card .corner {
      animation: cornerPop .4s cubic-bezier(.3, 1.6, .5, 1) .7s backwards;
    }

    @keyframes cornerPop {
      from {
        transform: scale(0);
      }
      to {
        transform: scale(1);
      }
    }

    /* 导航项：逐条上滑 */
    .nav-item {
      animation: navIn .4s cubic-bezier(.22, .8, .3, 1) backwards;
    }

    .nav-item:nth-child(1) { animation-delay: .55s; }
    .nav-item:nth-child(2) { animation-delay: .62s; }
    .nav-item:nth-child(3) { animation-delay: .69s; }
    .nav-item:nth-child(4) { animation-delay: .76s; }
    .nav-item:nth-child(5) { animation-delay: .83s; }
    .nav-item:nth-child(6) { animation-delay: .9s; }

    @keyframes navIn {
      from {
        opacity: 0;
        transform: translateY(1rem);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ── 手机竖屏适配 ── */
    @media (orientation: portrait) {
      /* 留白框：收窄边距，避开刘海 / 底部手势条 */
      .frame {
        top: calc(1.25rem + env(safe-area-inset-top));
        bottom: calc(3.5rem + env(safe-area-inset-bottom));
        left: calc(1.5rem + env(safe-area-inset-left));
        right: calc(1.5rem + env(safe-area-inset-right));
      }

      /* 页面内容超出时可滚动，且子项不被压缩重叠 */
      .page {
        overflow-y: auto;
      }

      .page > * {
        flex-shrink: 0;
      }

      /* 顶部节标题下方留出间距，避免头像装饰角标上探与 PROFILE 重叠 */
      .topline {
        margin-bottom: 1.5rem;
      }

      /* 头像 + 身份信息纵向堆叠，用 auto 外边距垂直居中（空间不足时自动回落为顶部对齐并可滚动） */
      .profile-row {
        flex-direction: column;
        align-items: flex-start;
        flex: 0 0 auto;
        margin-top: auto;
        margin-bottom: auto;
        gap: 1.5rem;
      }

      .avatar-card .avatar {
        width: 5.75rem;
        height: 5.75rem;
      }

      .cn-title {
        font-size: 2.5rem;
      }

      .alias {
        font-size: 1.1rem;
      }

      .tagline {
        font-size: 1.1rem;
      }

      /* 导航：更高触控区 */
      .nav-item {
        height: 3.25rem;
        gap: 1rem;
        padding-left: 1.25rem;
      }

      .nav-item .nav-num {
        font-size: .85rem;
        min-width: 2.25rem;
      }

      .nav-item .nav-en {
        font-size: .85rem;
      }

      .nav-item .nav-cn {
        font-size: 1.15rem;
      }

      .nav-item:active {
        color: #18d1ff;
      }

      .nav-item:active .nav-num,
      .nav-item:active .nav-en {
        color: #18d1ff;
      }

      .nav-item:active i {
        color: #18d1ff;
        transform: translateX(.25rem);
      }

      /* 按钮加高，主按钮拉满宽度 */
      .btn {
        height: 3.75rem;
        padding: 0 1.25rem;
      }

      .btn .cn {
        font-size: 1.35rem;
      }

      .btn .en {
        font-size: 1rem;
      }

      .btn-back {
        height: 3rem;
        padding: 0 1.75rem 0 2.25rem;
      }

      .action-row {
        margin-top: 1.5rem;
        gap: 1rem;
      }

      .btn.primary {
        flex: 1;
      }

      .btn-comments {
        flex: 0 0 auto;
        padding: 0 1.5rem;
        gap: 1rem;
      }

      .page-2 .topline {
        margin-bottom: 1.5rem;
      }

      .content {
        font-size: 1.05rem;
        padding-right: 1rem;
      }

      /* 留言板面板：移动端全屏 */
      .comments-panel {
        width: 100%;
        border-left: 0;
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
      }

      .comments-panel-head {
        padding: calc(.75rem + env(safe-area-inset-top)) 1rem .75rem;
      }

      .comments-panel-body {
        padding: 1rem;
      }

      /* 页脚跟随留白框收窄 */
      .site-footer {
        left: calc(1.5rem + env(safe-area-inset-left));
        right: calc(1.5rem + env(safe-area-inset-right));
        bottom: calc(1.25rem + env(safe-area-inset-bottom));
        font-size: .8rem;
      }
    }

    /* ── 减少动态 ── */
    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>

  <a href="#main" class="skip-link">跳转到主内容</a>

  <div class="stage" id="stage">
    <div class="bg-grid" aria-hidden="true">
      <div class="grid-spotlight"></div>
    </div>

    <main id="main" class="frame" role="main">
      <span class="fc fc-tl" aria-hidden="true"></span>
      <span class="fc fc-tr" aria-hidden="true"></span>
      <span class="fc fc-bl" aria-hidden="true"></span>
      <span class="fc fc-br" aria-hidden="true"></span>
      <!-- ═══ PAGE 1 · 主页 ─────────────────── -->
      <section class="page page-1" data-page="1" aria-labelledby="name-heading">
        <header class="topline stagger">
          <span class="eyebrow">PROFILE ://</span>
          <span class="topline-rule"></span>
        </header>

        <div class="profile-row stagger">
          <div class="avatar-card">
            <span class="corner" aria-hidden="true"></span>
            <img class="avatar" src="{{avatar.src}}" alt="{{avatar.alt}}" width="176" height="176">
          </div>
          <div class="identity">
            <p class="greeting">HELLO, I AM</p>
            <h1 id="name-heading" class="cn-title reveal-text">{{site.author}}</h1>
            <div class="title-rule"></div>
            <p class="alias reveal-text">{{site.alias}}</p>
            <p class="tagline reveal-text">{{site.description}}</p>
          </div>
        </div>

        <nav class="nav-list stagger" aria-label="导航链接">
          {{nav}}
        </nav>

        <div class="action-row stagger">
          {{shields_section}}
          <button class="btn primary btn-show-more" id="btn-show-more" aria-label="查看更多信息">
            <span class="btn-text"><span class="cn">查看更多</span><span class="en">SHOW MORE</span></span>
            <svg class="arrow" viewBox="0 0 7 15" aria-hidden="true">
              <path d="M1 1l5 6.5L1 14" stroke="currentColor" fill="none" stroke-width="1.5" />
            </svg>
          </button>
          <button class="btn gray btn-comments" id="btn-comments" aria-label="打开留言板">
            <span class="btn-text"><span class="cn">留言</span><span class="en">COMMENTS</span></span>
            <svg class="arrow" viewBox="0 0 7 15" aria-hidden="true">
              <path d="M1 1l5 6.5L1 14" stroke="currentColor" fill="none" stroke-width="1.5" />
            </svg>
          </button>
        </div>
      </section>

      <!-- ═══ PAGE 2 · 档案 ─────────────────── -->
      <section class="page page-2" data-page="2" aria-label="详细内容">
        <header class="topline stagger">
          <button class="btn gray btn-back" id="btn-back" aria-label="返回主页">
            <svg class="arrow-left" viewBox="0 0 7 15" aria-hidden="true">
              <path d="M1 1l5 6.5L1 14" stroke="currentColor" fill="none" stroke-width="1.5" />
            </svg>
            <span class="btn-text"><span class="cn">返回</span><span class="en">BACK</span></span>
          </button>
          <span class="topline-rule"></span>
          <span class="eyebrow">ABOUT ://</span>
        </header>

        <div class="content stagger">
          {{content}}
        </div>
      </section>
    </main>

    <footer class="site-footer" role="contentinfo">
      <span>&copy; {{footer.year}} {{footer.copyright_holder}}</span>
      <a href="{{footer.github_link}}" target="_blank" rel="noopener noreferrer">GITHUB SOURCE</a>
    </footer>
  </div>

  <div class="comments-backdrop" id="comments-backdrop" aria-hidden="true"></div>
  <aside class="comments-panel" id="comments-panel" aria-label="留言板" aria-hidden="true">
    <div class="comments-panel-head">
      <span class="eyebrow">COMMENTS ://</span>
      <span class="topline-rule"></span>
      <button class="comments-close" id="comments-close" aria-label="关闭留言板">✕</button>
    </div>
    <div class="comments-panel-body">
      <div id="tcomment"></div>
    </div>
  </aside>

  <script src="https://cdn.jsdmirror.com/npm/feather-icons/dist/feather.min.js"></script>
  <script src="https://cdn.jsdmirror.cn/npm/twikoo@1.7.19/dist/twikoo.min.js"></script>
  <script>
    twikoo.init({
      envId: 'https://c.creeper938.top',
      el: '#tcomment',
    })
  </script>
  <script>(function () {
      if (window.feather) { feather.replace({ class: 'icon' }); }

      /* rem 缩放：桌面 1920 / 移动 750 */
      function fit() {
        var w = window.innerWidth, h = window.innerHeight, base;
        if (h > w) {
          base = Math.min(16, Math.max(12, w / 414 * 16));
        } else {
          base = Math.min(20, Math.max(9, w / 1920 * 16));
        }
        document.documentElement.style.fontSize = base + 'px';
      }
      fit();
      window.addEventListener('resize', fit);

      /* 入场动画 */
      var d = 0, t = 12;
      document.querySelectorAll('.reveal-text').forEach(function (e) {
        var c = [...e.textContent];
        e.textContent = '';
        c.forEach(function (ch, i) {
          var s = document.createElement('span');
          s.className = 'char';
          s.style.animationDelay = (d + i * t) + 'ms';
          s.textContent = ch === ' ' ? '\u00a0' : ch;
          e.appendChild(s);
        });
        d += c.length * t;
      });
      document.querySelectorAll('.stagger').forEach(function (e, i) {
        e.style.animationDelay = (d + i * 40) + 'ms';
      });

      /* 页面切换 */
      var stage = document.getElementById('stage');
      document.getElementById('btn-show-more').addEventListener('click', function () {
        stage.classList.add('flipped');
      });
      document.getElementById('btn-back').addEventListener('click', function () {
        stage.classList.remove('flipped');
      });

      /* 留言板面板 */
      var commentsPanel = document.getElementById('comments-panel');
      var commentsBackdrop = document.getElementById('comments-backdrop');
      function openComments() {
        commentsPanel.classList.add('open');
        commentsBackdrop.classList.add('open');
        commentsPanel.setAttribute('aria-hidden', 'false');
        commentsBackdrop.setAttribute('aria-hidden', 'false');
      }
      function closeComments() {
        commentsPanel.classList.remove('open');
        commentsBackdrop.classList.remove('open');
        commentsPanel.setAttribute('aria-hidden', 'true');
        commentsBackdrop.setAttribute('aria-hidden', 'true');
      }
      document.getElementById('btn-comments').addEventListener('click', openComments);
      document.getElementById('comments-close').addEventListener('click', closeComments);
      commentsBackdrop.addEventListener('click', closeComments);
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') { closeComments(); }
      });

      /* 背景网格光晕跟随 */
      if (window.matchMedia('(any-hover: hover)').matches) {
        var bgGrid = document.querySelector('.bg-grid');
        var spot = bgGrid.querySelector('.grid-spotlight');
        stage.addEventListener('mousemove', function (e) {
          var r = stage.getBoundingClientRect();
          spot.style.transform = 'translate3d(' + (e.clientX - r.left) + 'px,' + (e.clientY - r.top) + 'px,0)';
          if (!bgGrid.classList.contains('grid-lit')) { bgGrid.classList.add('grid-lit'); }
        });
        stage.addEventListener('mouseleave', function () {
          bgGrid.classList.remove('grid-lit');
        });
      }
    })()</script>
</body>

</html>
